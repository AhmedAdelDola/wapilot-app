<!doctype html>
<html lang="ar" dir="rtl" data-theme="light" data-screen="true" data-preference="system" data-motion="shake">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Message Pro · App Splash</title>

<style>
:root { --brand:#4162e3; --canvas:#fafafa; --ink:#0d0d0d; --muted:#626262; --rule:#dedfe5; --ground:#eeeef1; --control:#fff; --active:#e9edff; --accent:#4162e3; color-scheme:light; font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
:root[data-theme="dark"] { --canvas:#0d0d0d; --ink:#fafafa; --muted:#aeb5c9; --rule:#303138; --ground:#17181c; --control:#222329; --active:#303b64; --accent:#8da4ff; color-scheme:dark; }
* { box-sizing:border-box; }
body { margin:0; color:var(--ink); background:var(--ground); }
button,a { -webkit-tap-highlight-color:transparent; }
button,select,a { font:inherit; }
button,select { color:var(--ink); }
button,a { touch-action:manipulation; }
button:focus-visible,select:focus-visible,a:focus-visible { outline:3px solid var(--accent); outline-offset:4px; }
::selection { background:var(--brand); color:#fff; }
body { scrollbar-color:var(--muted) var(--ground); }
.toolbar { display:flex; align-items:center; justify-content:space-between; gap:24px; padding:22px 32px; background:var(--canvas); border-bottom:1px solid var(--rule); }
h1 { font-size:18px; font-weight:600; margin:0 0 6px; }
.subtitle { margin:0; color:var(--muted); font-size:12px; line-height:1.7; }
.controls { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
.segment { display:flex; padding:4px; gap:2px; background:var(--ground); border-radius:10px; }
button { cursor:pointer; border:0; background:transparent; min-height:40px; padding:0 14px; border-radius:7px; font-size:12px; }
.segment button[aria-pressed="true"] { background:var(--control); color:var(--accent); }
button:hover { background:var(--active); }
.select-wrap { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:12px; }
select { background:var(--control); border:1px solid var(--rule); border-radius:8px; min-height:44px; padding:0 9px; cursor:pointer; }
main { min-height:calc(100svh - 103px); padding:28px 24px 20px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; }
.device { width:340px; height:640px; max-width:100%; flex-shrink:0; padding:7px; background:#303138; border-radius:39px; box-shadow:0 16px 40px #00000018; }
.screen { position:relative; width:100%; height:100%; overflow:hidden; isolation:isolate; border-radius:32px; background:var(--canvas); color:var(--ink); container-type:inline-size; }
.brand { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; transform:translateY(-18px); }
/* Timing scales only in the slow-motion preview; exported screens use normal speed. */
:root { --pace:1; --piece-loop:none; --loop-start:2400ms; --sheen-color:#fff; }
:root[data-theme="dark"] { --sheen-color:#8da4ff; }
:root[data-motion="gather"] { --piece-loop:reassemble; }
:root[data-speed="slow"] { --pace:2.5; }
.logo { width:min(68cqw,300px); max-width:100%; aspect-ratio:3528 / 703; position:relative; }
.logo svg { display:block; width:100%; height:100%; overflow:visible; fill:none; stroke:none; }
.mark-home { transform-box:view-box; transform-origin:18.2823% 50%; animation:mark-home calc(440ms * var(--pace)) cubic-bezier(.65,0,.2,1) calc(820ms * var(--pace)) both; }
.mark-piece { transform-box:view-box; animation:assemble calc(620ms * var(--pace)) cubic-bezier(.16,1,.3,1) 0ms 1 normal both, var(--piece-loop) calc(3000ms * var(--pace)) linear calc(var(--loop-start) * var(--pace)) infinite; }
.piece-left { --from-x:-210px; --from-y:180px; --from-angle:-12deg; --idle-x:70px; --idle-y:0px; --idle-angle:0deg; transform-origin:6% 50%; }
.piece-middle { --from-x:20px; --from-y:-230px; --from-angle:8deg; --idle-x:0px; --idle-y:-65px; --idle-angle:0deg; transform-origin:18% 50%; animation-delay:calc(70ms * var(--pace)),calc((var(--loop-start) + 100ms) * var(--pace)); }
.piece-right { --from-x:240px; --from-y:160px; --from-angle:12deg; --idle-x:-70px; --idle-y:0px; --idle-angle:0deg; transform-origin:30% 65%; animation-delay:calc(140ms * var(--pace)),calc((var(--loop-start) + 200ms) * var(--pace)); }
.wordmark { animation:name-in calc(460ms * var(--pace)) cubic-bezier(.16,1,.3,1) calc(1220ms * var(--pace)) both; }
.motion-picker { display:flex; align-items:center; justify-content:center; gap:12px; padding:14px 16px; background:var(--canvas); border-bottom:1px solid var(--rule); font-size:12px; }
.motion-picker .segment { flex:none; flex-wrap:wrap; }
.mark-motion { transform-box:view-box; transform-origin:18.2823% 50%; }
[data-motion="pulse"] .mark-motion { animation:mark-pulse calc(3000ms * var(--pace)) ease-in-out calc(var(--loop-start) * var(--pace)) infinite; }
.shine-window { display:none; }
[data-motion="shine"] .shine-window { display:block; }
.shine { opacity:0; animation:mark-shine calc(2800ms * var(--pace)) cubic-bezier(.45,0,.25,1) calc(var(--loop-start) * var(--pace)) infinite; }
.shine-stop { stop-color:var(--sheen-color); }
.screen.is-previewing-motion { --loop-start:0ms; }
.screen.is-previewing-motion .mark-home,.screen.is-previewing-motion .wordmark { animation:none; }
.screen.is-previewing-motion .mark-piece { animation-name:none,var(--piece-loop); }
.screen.is-resetting .mark-home,.screen.is-resetting .mark-piece,.screen.is-resetting .wordmark,.screen.is-resetting .mark-motion,.screen.is-resetting .shine { animation:none; }
.status { position:absolute; bottom:max(44px,env(safe-area-inset-bottom)); left:20px; right:20px; margin:0; text-align:center; color:var(--muted); font-size:13px; line-height:1.8; }
.screen::after { content:""; position:absolute; bottom:10px; left:50%; transform:translateX(-50%); width:30%; height:4px; border-radius:5px; background:var(--ink); opacity:.17; }
[data-device="desktop"] .device { width:min(1040px,100%); height:auto; aspect-ratio:16/10; max-height:700px; padding:7px; border-radius:16px; }
[data-device="desktop"] .screen { border-radius:10px; }
[data-device="desktop"] .logo { width:292px; }
[data-device="desktop"] .screen::after { display:none; }
[data-device="desktop"] .status { bottom:32px; }
.actions { display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:10px; }
.actions button,.actions a { display:inline-flex; align-items:center; justify-content:center; gap:7px; padding:0 16px; min-height:44px; border:1px solid var(--rule); border-radius:8px; background:var(--canvas); color:var(--ink); text-decoration:none; font-size:12px; }
.actions button:hover,.actions a:hover { background:var(--active); }
.actions .primary { background:var(--brand); border-color:var(--brand); color:white; }
.actions .primary:hover { background:#1b21a9; }
svg { width:16px; height:16px; flex-shrink:0; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
.note { margin:0; color:var(--muted); font-size:13px; line-height:1.8; text-align:center; }
:root[data-screen="true"] body { background:var(--canvas); }
:root[data-screen="true"] .motion-picker,:root[data-screen="true"] .toolbar,:root[data-screen="true"] .actions,:root[data-screen="true"] .note { display:none; }
:root[data-screen="true"] main { min-height:100svh; height:100dvh; padding:0; display:block; }
:root[data-screen="true"] .device { width:100%; height:100%; max-height:none; aspect-ratio:auto; padding:0; border-radius:0; box-shadow:none; }
:root[data-screen="true"] .screen { border-radius:0; }
:root[data-screen="true"] .screen::after { display:none; }
:root[data-screen="true"] .logo { width:min(64vw,292px); }
/* A short, damped shake of the complete M, followed by a settled pause. */
[data-motion="shake"] .mark-motion { animation:mark-shake calc(3000ms * var(--pace)) ease-in-out calc(var(--loop-start) * var(--pace)) infinite; }
@keyframes mark-shake {
 0%,20%,100% { transform:translateX(0) rotate(0deg); }
 3% { transform:translateX(-24px) rotate(-4deg); }
 6% { transform:translateX(21px) rotate(3.5deg); }
 9% { transform:translateX(-16px) rotate(-2.6deg); }
 12% { transform:translateX(11px) rotate(1.8deg); }
 15% { transform:translateX(-6px) rotate(-.9deg); }
 18% { transform:translateX(2px) rotate(.3deg); }
}

@keyframes assemble { from { transform:translate(var(--from-x),var(--from-y)) rotate(var(--from-angle)); opacity:0; } 35% { opacity:1; } to { transform:translate(0,0) rotate(0); opacity:1; } }
/* The loading loop keeps the mark legible: small staggered separation,
   an eased return, then a long settled beat. The entrance remains unchanged. */
@keyframes reassemble {
 0%,12%,62%,100% { transform:translate(0,0) rotate(0); opacity:1; }
 12% { animation-timing-function:cubic-bezier(.45,0,.25,1); }
 32% { transform:translate(var(--idle-x),var(--idle-y)) rotate(var(--idle-angle)); opacity:1; animation-timing-function:cubic-bezier(.16,1,.3,1); }
}
.screen[data-state="ready"] .mark-piece,.screen[data-state="ready"] .mark-motion,.screen[data-state="ready"] .shine { animation:none; }
.screen.is-paused .mark-home,.screen.is-paused .mark-piece,.screen.is-paused .wordmark,.screen.is-paused .mark-motion,.screen.is-paused .shine { animation-play-state:paused; }
@keyframes mark-shine {
 0% { transform:translateX(0); opacity:0; }
 8% { opacity:.75; }
 48% { transform:translateX(2050px); opacity:.75; }
 55%,100% { transform:translateX(2050px); opacity:0; }
}
@keyframes mark-pulse {
 0%,12%,62%,100% { transform:scale(1); }
 30% { transform:scale(.95); }
 46% { transform:scale(1.015); }
}
@keyframes mark-home { from { transform:translateX(31.7177%) scale(1.08); } to { transform:translateX(0) scale(1); } }
@keyframes name-in { from { opacity:0; transform:translateX(90px); } to { opacity:1; transform:translateX(0); } }
@media (max-width:760px) {
 .motion-picker { flex-wrap:wrap; gap:8px; }
 .motion-picker .segment { width:100%; }
 .toolbar { padding:18px 16px; flex-direction:column; align-items:stretch; gap:16px; }
 .controls { gap:8px; justify-content:space-between; }
 .segment { flex:1; }
 .segment button { flex:1; }
 main { padding:22px 16px; min-height:0; }
 .device { width:320px; height:600px; }
 [data-device="desktop"] .device { min-height:240px; }
 [data-device="desktop"] .logo { width:min(60cqw,292px); }
 [data-device="desktop"] .status { bottom:20px; }
 .actions { gap:8px; }
 .actions button,.actions a { padding:0 12px; }
}
@media (max-height:500px) { :root[data-screen="true"] .status { bottom:20px; } }
@media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation:none !important; transition:none !important; }  }
</style>

 if(['electric','message'].includes(motion))motion='shake'; // Older preview links select the current motion.
 if(!['shake','shine','pulse','gather'].includes(motion))motion='shake';
 let screenVisible=true;
 const words={ar:{loading:'جارٍ تجهيز مساحة عملك',ready:'جاهز للبدء'},en:{loading:'Preparing your workspace',ready:'Ready to begin'}};
 if(!['light','dark','system'].includes(theme)) theme='system';
 if(!['mobile','desktop'].includes(device)) device='mobile';
 if(!['ar','en'].includes(language)) language='ar';
 root.dataset.screen=String(standalone);
 function updateText(){status.textContent=words[language][screen.dataset.state];status.lang=language;status.dir=language==='ar'?'rtl':'ltr';}
 function sync(){
  root.dataset.theme=theme==='system'?(media.matches?'dark':'light'):theme;
  root.dataset.preference=theme;root.dataset.device=device;root.dataset.language=language;root.dataset.motion=motion;
  document.querySelectorAll('button[data-motion]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.motion===motion)));
  document.querySelectorAll('[data-brand-fragment]').forEach(fragment=>fragment.setAttribute('href',root.dataset.theme==='dark'?'#brand-art-white':'#brand-art-blue'));
  document.querySelectorAll('button[data-theme]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.theme===theme)));
  document.querySelectorAll('button[data-device]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.device===device)));
  document.querySelector('#language').value=language;
  document.querySelector('#open-screen').href='?'+new URLSearchParams({screen:'1',theme,device,lang:language,motion});
  updateText();
 }
 function complete(){screen.dataset.state='ready';updateText();}
 function replay(slow=false){
  screen.classList.remove('is-previewing-motion');
  root.dataset.speed=slow?'slow':'normal';
  document.querySelector('#timing-note').textContent=slow?'حركة تحميل مستمرة · عرض بطيء':'هزّة خفيفة للـM أثناء التحميل';
  screen.dataset.state='loading';updateText();
  screen.classList.add('is-resetting');void screen.offsetWidth;screen.classList.remove('is-resetting');
 }
 document.querySelectorAll('button[data-theme]').forEach(b=>b.addEventListener('click',()=>{theme=b.dataset.theme;sync();replay();}));
 document.querySelectorAll('button[data-device]').forEach(b=>b.addEventListener('click',()=>{device=b.dataset.device;sync();replay();}));
 document.querySelectorAll('button[data-motion]').forEach(b=>b.addEventListener('click',()=>{motion='shake';root.dataset.speed='normal';sync();screen.dataset.state='loading';updateText();screen.classList.add('is-previewing-motion','is-resetting');void screen.offsetWidth;screen.classList.remove('is-resetting');document.querySelector('#timing-note').textContent='معاينة حركة الانتظار · إعادة التشغيل تعرض المقدمة';}));
 document.querySelector('#language').addEventListener('change',e=>{language=e.target.value;sync();});
 document.querySelector('#replay').addEventListener('click',()=>replay());
 document.querySelector('#replay-slow').addEventListener('click',()=>replay(true));
 document.querySelector('#finish').addEventListener('click',complete);
 function updateVisibility(){screen.classList.toggle('is-paused',document.hidden||!screenVisible);}
 document.addEventListener('visibilitychange',updateVisibility);
 if('IntersectionObserver' in window)new IntersectionObserver(([entry])=>{screenVisible=entry.isIntersecting;updateVisibility();}).observe(screen);
 media.addEventListener('change',()=>{if(theme==='system')sync();});
 document.querySelector('#download').addEventListener('click',()=>{
  const copy=root.cloneNode(true);copy.dataset.screen='true';copy.dataset.preference=theme;
  copy.querySelector('.screen').dataset.state='loading';copy.querySelector('.status').textContent=words[language].loading;
  copy.dataset.speed='normal';copy.querySelector('.screen').classList.remove('is-resetting','is-paused','is-previewing-motion');
  const blob=new Blob(['<!doctype html>\n'+copy.outerHTML],{type:'text/html;charset=utf-8'});
  const url=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=url;a.download=`message-pro-splash-${device}-${theme}-${motion}.html`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
 });
 // Integration hook for a WebView/Electron host. Native launch assets still need platform integration.
 window.MessageProSplash=Object.freeze({complete,replay,setTheme(value){if(['light','dark','system'].includes(value)){theme=value;sync();}}});
 sync();replay();
})();
</script>
</body>
</html>
